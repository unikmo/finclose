name: Apply v0.33 production hardening
on:
  push:
    branches: [feature/production-foundation-v033d]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v033-hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-foundation-v033d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production hardening
        run: python scripts/apply-v033-production-hardening.py
      - name: Refresh dependencies
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit generated changes
        run: |
          git config user.name "unikmo"
          git config user.email "mbanwie@googlemail.com"
          git add lib/close-governance-engine.ts app/api/'[...path]'/route.ts package-lock.json
          git commit -m "Apply v0.33 production hardening [v033-hardening-applied]" || exit 0
          git push origin HEAD:feature/production-foundation-v033d
