name: FinClose CI

on:
  push:
    branches: [main, vercel-firebase]
  pull_request:

concurrency:
  group: finclose-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run deterministic hardening tests
        run: npm test
      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/firebase-pilot-controls.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate Vercel release helper syntax
        shell: bash
        run: |
          bash -n scripts/vercel-release-deploy.sh
          bash -n scripts/vercel-release-verify.sh
      - name: Build Vercel Next.js application
        run: npm run build
