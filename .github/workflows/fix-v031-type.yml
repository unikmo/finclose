name: Fix v0.31 type
on:
  push:
    branches: [feature/finance-cycle-v031]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-cycle-v031
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/finance-cycle-engine.ts')
          s=p.read_text()
          old='function stable(value: unknown) {'
          new='function stable(value: unknown): unknown {'
          if old not in s: raise SystemExit('expected stable signature not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/finance-cycle-engine.ts
          git commit -m 'Fix recursive stable fingerprint typing'
          git push origin HEAD:feature/finance-cycle-v031
