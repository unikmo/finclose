name: Apply Layer A v0.32

on:
  push:
    branches: [feature/layer-a-close-governance-v032]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/layer-a-close-governance-v032
      - name: Integrate Layer A close governance
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path)
              s=p.read_text()
              for old,new in replacements:
                  if old not in s:
                      raise SystemExit(f'{path}: missing expected snippet: {old[:160]}')
                  s=s.replace(old,new,1)
              p.write_text(s)

          patch('package.json', [
              ('"version": "0.31.0"', '"version": "0.32.0"')
          ])

          patch('lib/payroll-engine.ts', [
              ("import { getServiceDeployment } from './service-deployments';", "import { getServiceDeployment } from './service-deployments';\nimport { assertDateRangeOpenForCompany } from './close-governance-engine';"),
              ("  if (!['RECEIVED', 'NOT_APPLICABLE_NEW_COMPANY'].includes(String(deployment.history_status || ''))) {\n    const error = new Error('complete payroll history before preparing payroll');\n    (error as Error & { status?: number }).status = 409;\n    throw error;\n  }\n\n  const countryCode", "  if (!['RECEIVED', 'NOT_APPLICABLE_NEW_COMPANY'].includes(String(deployment.history_status || ''))) {\n    const error = new Error('complete payroll history before preparing payroll');\n    (error as Error & { status?: number }).status = 409;\n    throw error;\n  }\n\n  await assertDateRangeOpenForCompany(String(deployment.company_id), String(input.pay_period_start), String(input.pay_period_end), 'payroll run');\n\n  const countryCode")
          ])

          patch('lib/bookkeeping-engine.ts', [
              ("import { getServiceDeployment } from './service-deployments';", "import { getServiceDeployment } from './service-deployments';\nimport { assertDateRangeOpenForCompany } from './close-governance-engine';"),
              ("    'period locking',", "    'external accounting-provider period locking',"),
              ("  if (!['RECEIVED', 'NOT_APPLICABLE_NEW_COMPANY'].includes(String(deployment.history_status || ''))) {\n    throw httpError('complete bookkeeping history before preparing bookkeeping', 409);\n  }\n\n  const db", "  if (!['RECEIVED', 'NOT_APPLICABLE_NEW_COMPANY'].includes(String(deployment.history_status || ''))) {\n    throw httpError('complete bookkeeping history before preparing bookkeeping', 409);\n  }\n\n  await assertDateRangeOpenForCompany(String(deployment.company_id), String(input.period_start), String(input.period_end), 'bookkeeping batch');\n\n  const db")
          ])

          patch('lib/finance-cycle-engine.ts', [
              ("import { getServiceDeployment } from './service-deployments';", "import { getServiceDeployment } from './service-deployments';\nimport { assertDateRangeOpenForCompany } from './close-governance-engine';"),
              ('  period_scope_complete: boolean;', '  period_scope_complete?: boolean;'),
              ("  monthly_close_version: 'MONTHLY-CLOSE-CONTROL-V1',", "  monthly_close_version: 'MONTHLY-CLOSE-CONTROL-V2',"),
              ("    'A monthly close can pass controls only when period_scope_complete is explicitly true.',", "    'Final monthly-close approval requires Layer A source completeness and material balance-sheet reconciliation.',"),
              ("  execution_boundary: 'PREPARED_NOT_CLOSED'", "  execution_boundary: 'PREPARED_PENDING_LAYER_A'"),
              ("  if (!input.periodScopeComplete) exceptions.push('PERIOD_SCOPE_NOT_CONFIRMED_COMPLETE');\n", ""),
              ("    status: controlStatus === 'PASS' ? 'CONTROLS_PASS_APPROVAL_REQUIRED' : 'EXCEPTIONS_OPEN',\n    control_status: controlStatus,\n    close_status: FINANCE_CYCLE_CAPABILITIES.execution_boundary,\n    approval_status: 'APPROVAL_REQUIRED',", "    status: controlStatus === 'PASS' ? 'CORE_CONTROLS_PASS_LAYER_A_REQUIRED' : 'EXCEPTIONS_OPEN',\n    control_status: controlStatus,\n    close_status: 'PREPARED_NOT_CLOSED',\n    approval_status: 'BLOCKED_PENDING_LAYER_A',"),
              ("      period_scope_complete: input.periodScopeComplete", "      legacy_period_scope_attestation: input.periodScopeComplete === true"),
              ("      'This close package is a control result, not a posted or locked accounting period.',\n      'Only bank closing-balance control is evaluated; broader balance-sheet reconciliations are not yet automated.',\n      'No external accounting-system posting, filing, payment or period lock is performed.',\n      'period_scope_complete is a caller attestation until connector ingestion can independently prove source completeness.'", "      'This core close package requires Layer A source-completeness and balance-sheet controls before approval.',\n      'Internal FinClose approval and period locking are handled by CLOSE-GOVERNANCE-LAYER-A-V1.',\n      'No external accounting-system posting, external-provider period lock, filing or payment is performed.',\n      'period_scope_complete is retained only as a deprecated compatibility attestation and is not an approval control.'"),
              ("  if (periodStart > periodEnd) throw httpError('period_start must not be after period_end', 400);\n  if (typeof input.period_scope_complete !== 'boolean') throw httpError('period_scope_complete must be true or false', 400);\n\n  const mapping", "  if (periodStart > periodEnd) throw httpError('period_start must not be after period_end', 400);\n  await assertDateRangeOpenForCompany(String(deployment.company_id), periodStart, periodEnd, 'finance cycle');\n\n  const mapping"),
              ("    period_scope_complete: input.period_scope_complete", "    period_scope_complete: input.period_scope_complete ?? null"),
              ("      closePass.close_status === 'PREPARED_NOT_CLOSED' &&\n      closePass.payroll_liabilities.outstanding_at_period_end.INCOME_TAX === 200 &&\n      closeBlocked.control_status === 'EXCEPTIONS_OPEN' &&\n      closeBlocked.exceptions.includes('PERIOD_SCOPE_NOT_CONFIRMED_COMPLETE') &&\n      closeBlocked.exceptions.includes('BANK_CLOSING_BALANCE_CONTROL_NOT_PROVIDED'),", "      closePass.close_status === 'PREPARED_NOT_CLOSED' &&\n      closePass.status === 'CORE_CONTROLS_PASS_LAYER_A_REQUIRED' &&\n      closePass.payroll_liabilities.outstanding_at_period_end.INCOME_TAX === 200 &&\n      closeBlocked.control_status === 'EXCEPTIONS_OPEN' &&\n      !closeBlocked.exceptions.includes('PERIOD_SCOPE_NOT_CONFIRMED_COMPLETE') &&\n      closeBlocked.exceptions.includes('BANK_CLOSING_BALANCE_CONTROL_NOT_PROVIDED'),")
          ])

          patch('app/api/[...path]/route.ts', [
              ("import { FINANCE_CYCLE_CAPABILITIES, financeCycleSelfTest, getFinanceCycle, getMonthlyClose, prepareFinanceCycle } from '../../../lib/finance-cycle-engine';", "import { FINANCE_CYCLE_CAPABILITIES, financeCycleSelfTest, getFinanceCycle, getMonthlyClose, prepareFinanceCycle } from '../../../lib/finance-cycle-engine';\nimport { CLOSE_GOVERNANCE_CAPABILITIES, approveMonthlyClose, closeGovernanceSelfTest, configureBalanceSheetScope, configureSourceRequirements, evaluateSourceCompleteness, getCloseGovernance, lockMonthlyClose, prepareBalanceSheetReconciliation, recordPeriodSourceEvidence, reopenMonthlyClose } from '../../../lib/close-governance-engine';"),
              ("function forbidden(message = 'this service session belongs to another account') {", "function actorFromAuth(auth: ReturnType<typeof assertCustomerOrLab>) {\n  if (auth.kind === 'customer') return { kind: 'customer' as const, user_id: auth.user.user_id, name: auth.user.name, email: auth.user.email };\n  return { kind: 'lab' as const };\n}\n\nfunction forbidden(message = 'this service session belongs to another account') {"),
              ("version: '0.31.0'", "version: '0.32.0'"),
              ("version: '0.31.0'", "version: '0.32.0'"),
              ("      const financeCycle = financeCycleSelfTest();\n      if (!payroll.ok)", "      const financeCycle = financeCycleSelfTest();\n      const closeGovernance = closeGovernanceSelfTest();\n      if (!payroll.ok)"),
              ("      if (!financeCycle.ok) errors.push('finance-cycle: deterministic regression check failed');", "      if (!financeCycle.ok) errors.push('finance-cycle: deterministic regression check failed');\n      if (!closeGovernance.ok) errors.push('close-governance: deterministic regression check failed');"),
              ("          finance_cycle: financeCycle.ok,\n          monthly_close_controls: financeCycle.ok", "          finance_cycle: financeCycle.ok,\n          monthly_close_controls: financeCycle.ok,\n          source_completeness: closeGovernance.ok,\n          balance_sheet_reconciliation: closeGovernance.ok,\n          close_approval_and_period_lock: closeGovernance.ok"),
              ("        ok: reachable.database && reachable.storage && payroll.ok && bookkeeping.ok && financeCycle.ok,", "        ok: reachable.database && reachable.storage && payroll.ok && bookkeeping.ok && financeCycle.ok && closeGovernance.ok,"),
              ("    if (p.join('/') === 'finance-cycle/capabilities') return NextResponse.json(FINANCE_CYCLE_CAPABILITIES);", "    if (p.join('/') === 'finance-cycle/capabilities') return NextResponse.json(FINANCE_CYCLE_CAPABILITIES);\n    if (p.join('/') === 'close-governance/capabilities') return NextResponse.json(CLOSE_GOVERNANCE_CAPABILITIES);"),
              ("    if (p.length === 4 && p[0] === 'service-deployments' && p[2] === 'monthly-closes') {\n      await authorizedDeployment(req, p[1]);\n      return NextResponse.json(await getMonthlyClose(p[1], p[3]));\n    }", "    if (p.length === 4 && p[0] === 'service-deployments' && p[2] === 'monthly-closes') {\n      await authorizedDeployment(req, p[1]);\n      return NextResponse.json(await getMonthlyClose(p[1], p[3]));\n    }\n\n    if (p.length === 5 && p[0] === 'service-deployments' && p[2] === 'monthly-closes' && p[4] === 'governance') {\n      await authorizedDeployment(req, p[1]);\n      return NextResponse.json(await getCloseGovernance(p[1], p[3]));\n    }"),
              ("    if (p.length === 3 && p[0] === 'service-deployments' && p[2] === 'finance-cycles') {\n      return NextResponse.json(await prepareFinanceCycle(p[1], await req.json()));\n    }", "    if (p.length === 3 && p[0] === 'service-deployments' && p[2] === 'finance-cycles') {\n      return NextResponse.json(await prepareFinanceCycle(p[1], await req.json()));\n    }\n\n    if (p.length === 4 && p[0] === 'service-deployments' && p[2] === 'close-controls' && p[3] === 'source-requirements') {\n      return NextResponse.json(await configureSourceRequirements(p[1], await req.json()));\n    }\n\n    if (p.length === 4 && p[0] === 'service-deployments' && p[2] === 'close-controls' && p[3] === 'source-evidence') {\n      return NextResponse.json(await recordPeriodSourceEvidence(p[1], await req.json()));\n    }\n\n    if (p.length === 4 && p[0] === 'service-deployments' && p[2] === 'close-controls' && p[3] === 'balance-sheet-scope') {\n      return NextResponse.json(await configureBalanceSheetScope(p[1], await req.json()));\n    }\n\n    if (p.length === 6 && p[0] === 'service-deployments' && p[2] === 'monthly-closes' && p[4] === 'source-completeness' && p[5] === 'evaluate') {\n      return NextResponse.json(await evaluateSourceCompleteness(p[1], p[3]));\n    }\n\n    if (p.length === 5 && p[0] === 'service-deployments' && p[2] === 'monthly-closes' && p[4] === 'balance-sheet-reconciliation') {\n      return NextResponse.json(await prepareBalanceSheetReconciliation(p[1], p[3], await req.json()));\n    }\n\n    if (p.length === 5 && p[0] === 'service-deployments' && p[2] === 'monthly-closes' && p[4] === 'approve') {\n      const body = await req.json().catch(() => ({}));\n      return NextResponse.json(await approveMonthlyClose(p[1], p[3], actorFromAuth(auth), body.note));\n    }\n\n    if (p.length === 5 && p[0] === 'service-deployments' && p[2] === 'monthly-closes' && p[4] === 'lock') {\n      const body = await req.json().catch(() => ({}));\n      return NextResponse.json(await lockMonthlyClose(p[1], p[3], actorFromAuth(auth), body.note));\n    }\n\n    if (p.length === 5 && p[0] === 'service-deployments' && p[2] === 'monthly-closes' && p[4] === 'reopen') {\n      const body = await req.json();\n      return NextResponse.json(await reopenMonthlyClose(p[1], p[3], actorFromAuth(auth), String(body.reason || '')));\n    }")
          ])

          patch('CANONICAL_TRUTH.md', [
              ('Version: 13', 'Version: 14'),
              ("| Monthly close control engine | `MONTHLY-CLOSE-CONTROL-V1` evaluates payroll-journal balance, bookkeeping-journal balance, bank reconciliation exceptions, explicit period-scope completeness and statement-vs-ledger bank closing balance. It produces `CONTROLS_PASS_APPROVAL_REQUIRED` or `EXCEPTIONS_OPEN` | User implementation authorization + implementation | ACTIVE / SYNTHETIC LAB ONLY | No monthly-close orchestration |", "| Monthly close core control engine | `MONTHLY-CLOSE-CONTROL-V2` evaluates payroll-journal balance, bookkeeping-journal balance, bank reconciliation exceptions and statement-vs-ledger bank closing balance. A core pass produces `CORE_CONTROLS_PASS_LAYER_A_REQUIRED`; final approval is delegated to Layer A governance | User implementation authorization + implementation | ACTIVE / SYNTHETIC LAB ONLY | `MONTHLY-CLOSE-CONTROL-V1` caller-attestation approval model |"),
              ("| Monthly close execution boundary | A v0.31 monthly close is always `PREPARED_NOT_CLOSED` and `APPROVAL_REQUIRED`; FinClose does not yet post externally, lock a period, make payments or submit payroll/tax filings | Safety / release gate | ACTIVE | Implied automated final close |", "| Monthly close execution boundary | v0.32 can internally approve and lock a FinClose period after Layer A controls pass. External accounting-system posting/locking, payments and statutory filings remain disabled | Safety / release gate + implementation | ACTIVE / SYNTHETIC LAB ONLY | v0.31 `PREPARED_NOT_CLOSED` only |"),
              ("| Monthly close completeness boundary | `period_scope_complete` is an explicit caller attestation until connector ingestion can independently prove source completeness. Bank closing-balance control is mandatory for a controls-pass result; broader balance-sheet reconciliation remains unimplemented | Reliability boundary | ACTIVE | Implied completeness from payroll/bookkeeping handoff alone |", "| Monthly close completeness boundary | `period_scope_complete` is deprecated compatibility input only and no longer an approval control. v0.32 derives close completeness from a configured expected-source registry versus verified stored source artifacts, continuous period coverage and sequence controls. Manual-upload proof still depends on declared coverage metadata until live connector sync evidence is available | Reliability boundary + implementation | ACTIVE / SYNTHETIC LAB ONLY | v0.31 caller attestation |"),
              ("| Historical-context storage |", "| Layer A close governance | `CLOSE-GOVERNANCE-LAYER-A-V1` adds source-completeness proof, full material balance-sheet reconciliation, evidence-bound close approval, internal period locking and explicit reopen handling | User implementation authorization + implementation | ACTIVE / SYNTHETIC LAB ONLY | No Layer A governance |\n| Source completeness engine | Expected source requirements are configured separately from period evidence. Period evidence must reference stored FinClose service-source artifacts belonging to the deployment; coverage continuity, sequence completeness and optional statement continuity are derived into `SYSTEM_DERIVED_COMPLETE` or blockers | Implementation + reliability control | ACTIVE / SYNTHETIC LAB ONLY | Caller `period_scope_complete` attestation |\n| Balance-sheet reconciliation engine | Every configured material balance-sheet account must reconcile GL balance to an independent balance/evidence source. Reconciling items may be `RESOLVED`, `ACCEPTED_TIMING` or `OPEN`; unexplained differences beyond tolerance or any OPEN item block close approval | Implementation + accounting-control architecture | ACTIVE / SYNTHETIC LAB ONLY | Bank-only close reconciliation |\n| Internal close approval | A close can be approved only when core controls pass, source completeness is `SYSTEM_DERIVED_COMPLETE`, and material balance-sheet reconciliation is `PASS`. Approval records actor identity and a SHA-256 evidence snapshot; changed evidence requires re-approval | Implementation + control architecture | ACTIVE / SYNTHETIC LAB ONLY | `APPROVAL_REQUIRED` with no approval action |\n| Internal period lock | After approval, FinClose can lock the close period internally. Overlapping payroll, bookkeeping and finance-cycle preparation is rejected while the lock is active. Reopen requires an explicit reason, preserves lock history and invalidates approval | Implementation + control architecture | ACTIVE / SYNTHETIC LAB ONLY | No internal period lock |\n| External period lock | FinClose does not yet lock periods inside Xero, QuickBooks, DATEV or SmartAccounts; provider-specific lock execution belongs to Layer B connector work | Reliability boundary | OPEN | — |\n| Historical-context storage |")
          ])
          PY
      - name: Commit integrated Layer A
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json lib/payroll-engine.ts lib/bookkeeping-engine.ts lib/finance-cycle-engine.ts app/api/'[...path]'/route.ts CANONICAL_TRUTH.md
          git commit -m 'Integrate Layer A close governance v0.32'
          git push origin HEAD:feature/layer-a-close-governance-v032
