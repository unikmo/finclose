name: Apply Firebase-only v0.33
on:
  push:
    branches: [feature/production-foundation-v033d]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[firebase-only-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-foundation-v033d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Firebase-only architecture patch
        run: python scripts/apply-firebase-only-v033.py
      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit generated changes
        run: |
          git config user.name "unikmo"
          git config user.email "mbanwie@googlemail.com"
          git add app/api/'[...path]'/route.ts lib/close-governance-engine.ts CANONICAL_TRUTH.md package-lock.json
          git commit -m "Apply Firebase-only v0.33 architecture [firebase-only-applied]" || exit 0
          git push origin HEAD:feature/production-foundation-v033d
