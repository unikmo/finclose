name: Harden Layer A v0.32

on:
  push:
    branches: [feature/layer-a-close-governance-v032]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/layer-a-close-governance-v032
      - run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path); s=p.read_text()
              for old,new in replacements:
                  if old not in s: raise SystemExit(f'{path}: missing {old[:160]}')
                  s=s.replace(old,new,1)
              p.write_text(s)

          patch('lib/close-governance-engine.ts', [
            ("    const items = (entry.reconciling_items || []).map(item => ({\n      item_id: cleanId(item.item_id, `reconciling item id for ${code}`),\n      description: cleanText(item.description, `reconciling item description for ${code}`),\n      amount: signedMoney(item.amount, `reconciling item amount for ${code}`),\n      status: item.status\n    }));", "    const seenItems = new Set<string>();\n    const items = (entry.reconciling_items || []).map(item => {\n      const itemId = cleanId(item.item_id, `reconciling item id for ${code}`);\n      if (seenItems.has(itemId)) throw httpError(`duplicate reconciling item ${itemId} for ${code}`, 400);\n      seenItems.add(itemId);\n      const status = String(item.status || '').toUpperCase();\n      if (!['RESOLVED', 'ACCEPTED_TIMING', 'OPEN'].includes(status)) throw httpError(`invalid reconciling item status for ${code}:${itemId}`, 400);\n      return {\n        item_id: itemId,\n        description: cleanText(item.description, `reconciling item description for ${code}`),\n        amount: signedMoney(item.amount, `reconciling item amount for ${code}`),\n        status: status as ReconcilingItemInput['status']\n      };\n    });"),
            ("  const locked = existingCloseStatus === 'LOCKED';\n  const approved = existingApproval === 'APPROVED';\n  const status = locked\n    ? 'CLOSED_LOCKED'\n    : approved\n      ? 'APPROVED_READY_TO_LOCK'\n      : ready\n        ? 'CONTROLS_PASS_APPROVAL_REQUIRED'\n        : corePass\n          ? 'LAYER_A_INCOMPLETE'\n          : 'EXCEPTIONS_OPEN';\n  const approvalStatus = locked || approved ? existingApproval : ready ? 'APPROVAL_REQUIRED' : 'BLOCKED_PENDING_LAYER_A';", "  const locked = existingCloseStatus === 'LOCKED';\n  const reopened = existingCloseStatus === 'REOPENED';\n  const approved = existingApproval === 'APPROVED';\n  const effectiveReady = ready && !reopened;\n  const effectiveBlockers = reopened ? [...blockers, 'CLOSE_REOPENED_REQUIRES_NEW_VERSION'] : blockers;\n  const status = locked\n    ? 'CLOSED_LOCKED'\n    : reopened\n      ? 'REOPENED_REQUIRES_NEW_CLOSE'\n      : approved\n        ? 'APPROVED_READY_TO_LOCK'\n        : effectiveReady\n          ? 'CONTROLS_PASS_APPROVAL_REQUIRED'\n          : corePass\n            ? 'LAYER_A_INCOMPLETE'\n            : 'EXCEPTIONS_OPEN';\n  const approvalStatus = locked || approved ? existingApproval : reopened ? 'INVALIDATED_BY_REOPEN' : effectiveReady ? 'APPROVAL_REQUIRED' : 'BLOCKED_PENDING_LAYER_A';"),
            ("    governance_status: ready ? 'READY_FOR_APPROVAL' : 'BLOCKED',\n    blockers,", "    governance_status: reopened ? 'REOPENED_REQUIRES_NEW_CLOSE' : effectiveReady ? 'READY_FOR_APPROVAL' : 'BLOCKED',\n    blockers: effectiveBlockers,"),
            ("  return {\n    monthly_close_id: closeId,\n    finance_cycle_id: close.finance_cycle_id,\n    bookkeeping_batch_id: close.bookkeeping_batch_id,\n    payroll_run_id: close.payroll_run_id,\n    period_start: close.period_start,\n    period_end: close.period_end,\n    core_control_status: close.control_status,\n    core_controls: close.controls,\n    core_exceptions: close.exceptions || [],\n    source_completeness: sourceSnap.exists() ? sourceSnap.val() : null,\n    balance_sheet_reconciliation: balanceSnap.exists() ? balanceSnap.val() : null\n  };", "  const source = sourceSnap.exists() ? sourceSnap.val() as Record<string, any> : null;\n  const balance = balanceSnap.exists() ? balanceSnap.val() as Record<string, any> : null;\n  return {\n    monthly_close_id: closeId,\n    finance_cycle_id: close.finance_cycle_id,\n    bookkeeping_batch_id: close.bookkeeping_batch_id,\n    payroll_run_id: close.payroll_run_id,\n    period_start: close.period_start,\n    period_end: close.period_end,\n    core_control_status: close.control_status,\n    core_controls: close.controls,\n    core_exceptions: close.exceptions || [],\n    source_completeness: source ? {\n      engine_version: source.engine_version,\n      status: source.status,\n      proof_basis: source.proof_basis,\n      required_count: source.required_count,\n      complete_count: source.complete_count,\n      requirements: source.requirements || [],\n      blockers: source.blockers || []\n    } : null,\n    balance_sheet_reconciliation: balance ? {\n      engine_version: balance.engine_version,\n      status: balance.status,\n      material_account_count: balance.material_account_count,\n      reconciled_material_account_count: balance.reconciled_material_account_count,\n      accounts: balance.accounts || [],\n      exceptions: balance.exceptions || []\n    } : null\n  };"),
            ("  if (String(close.close_status || '') === 'LOCKED') return { ...close, duplicate: true };\n  if (String(close.layer_a?.governance_status || '') !== 'READY_FOR_APPROVAL')", "  if (String(close.close_status || '') === 'LOCKED') return { ...close, duplicate: true };\n  if (String(close.close_status || '') === 'REOPENED') throw httpError('reopened close requires a new close version before approval', 409);\n  if (String(close.layer_a?.governance_status || '') !== 'READY_FOR_APPROVAL')"),
            ("  const now = Date.now();\n  const reopenCount = Number(lock.reopen_count || 0) + 1;", "  const now = Date.now();\n  const reopenCount = Number(lock.reopen_count || 0) + 1;\n  const reopenNonce = crypto.randomUUID().replace(/-/g, '').slice(0, 12);"),
            ("    [`finclose_monthly_closes/${closeId}/reopen_reason`]: reasonText,\n    [`finclose_monthly_closes/${closeId}/updated_at`]: now,", "    [`finclose_monthly_closes/${closeId}/reopen_reason`]: reasonText,\n    [`finclose_monthly_closes/${closeId}/reopen_count`]: reopenCount,\n    [`finclose_monthly_closes/${closeId}/reopen_nonce`]: reopenNonce,\n    [`finclose_monthly_closes/${closeId}/updated_at`]: now,")
          ])

          patch('lib/finance-cycle-engine.ts', [
            ("  const cycleId = `${deploymentId}__${periodEnd}__${fingerprint.slice(0, 16)}`;\n  const closeId = `${deploymentId}__close__${periodEnd}__${fingerprint.slice(0, 16)}`;\n  const db = realtimeDatabase();\n  const existing = await db.ref(`finclose_finance_cycles/${cycleId}`).once('value');\n  if (existing.exists()) return { ...existing.val(), duplicate: true };", "  const baseCycleId = `${deploymentId}__${periodEnd}__${fingerprint.slice(0, 16)}`;\n  const baseCloseId = `${deploymentId}__close__${periodEnd}__${fingerprint.slice(0, 16)}`;\n  let cycleId = baseCycleId;\n  let closeId = baseCloseId;\n  const db = realtimeDatabase();\n  const existing = await db.ref(`finclose_finance_cycles/${baseCycleId}`).once('value');\n  if (existing.exists()) {\n    const latestCloseId = String(deployment.latest_monthly_close_id || (existing.val() as Record<string, any>).monthly_close_id || baseCloseId);\n    const latestCloseSnap = await db.ref(`finclose_monthly_closes/${latestCloseId}`).once('value');\n    const latestClose = latestCloseSnap.exists() ? latestCloseSnap.val() as Record<string, any> : null;\n    if (latestClose && String(latestClose.close_status || '') === 'REOPENED' && String(latestClose.period_end) === periodEnd) {\n      const nonce = String(latestClose.reopen_nonce || '');\n      if (!nonce) throw httpError('reopened close is missing version nonce', 409);\n      cycleId = `${baseCycleId}__reopen_${nonce}`;\n      closeId = `${baseCloseId}__reopen_${nonce}`;\n      const reopenedExisting = await db.ref(`finclose_finance_cycles/${cycleId}`).once('value');\n      if (reopenedExisting.exists()) return { ...reopenedExisting.val(), duplicate: true };\n    } else {\n      return { ...existing.val(), duplicate: true };\n    }\n  }")
          ])
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/close-governance-engine.ts lib/finance-cycle-engine.ts
          git commit -m 'Harden Layer A evidence and reopen controls'
          git push origin HEAD:feature/layer-a-close-governance-v032
