name: Harden finance cycle v0.31

on:
  push:
    branches:
      - feature/finance-cycle-v031

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-cycle-v031
      - name: Apply deterministic and partial-failure hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/finance-cycle-engine.ts')
          s = p.read_text()
          replacements = [
            ("import { calculateBookkeepingBatch, getBookkeepingBatch, prepareBookkeepingBatch } from './bookkeeping-engine';", "import { calculateBookkeepingBatch, prepareBookkeepingBatch } from './bookkeeping-engine';"),
            ("  if (Array.isArray(value)) return value.map(stable);", "  if (Array.isArray(value)) return value.map(stable).sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));"),
            ("    'Prepared monthly close does not lock the period, post externally, submit payroll filings or initiate payments.'", "    'Prepared monthly close does not lock the period, post externally, submit payroll filings or initiate payments.',\n    'Payroll recognition journals are dated at pay_period_end in V1; alternative recognition-date policies are not yet configurable.'"),
            ("  const payrollRun = await resolvePayrollRun(deploymentId, input);\n  const payrollPeriodEnd", "  const mapping = normalizedMapping(input.account_mapping);\n  const payrollRun = await resolvePayrollRun(deploymentId, input);\n  const payrollPeriodEnd"),
            ("\n  const mapping = normalizedMapping(input.account_mapping);\n  const settlements = settlementArtifacts", "\n  const settlements = settlementArtifacts"),
            ("[`finclose_payroll_runs/${payrollRun.payroll_run_id}/finance_cycle_id`]: cycleId,\n    [`finclose_payroll_runs/${payrollRun.payroll_run_id}/bookkeeping_batch_id`]: bookkeepingBatch.bookkeeping_batch_id,", "[`finclose_payroll_runs/${payrollRun.payroll_run_id}/latest_finance_cycle_id`]: cycleId,\n    [`finclose_payroll_runs/${payrollRun.payroll_run_id}/latest_bookkeeping_batch_id`]: bookkeepingBatch.bookkeeping_batch_id,")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected snippet: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit hardened implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/finance-cycle-engine.ts
          git commit -m 'Harden v0.31 finance-cycle determinism and lineage'
          git push origin HEAD:feature/finance-cycle-v031
