name: Fix v0.32 fingerprint
on:
  push:
    branches:
      - feature/layer-a-close-governance-v032
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/layer-a-close-governance-v032
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/finance-cycle-engine.ts')
          s=p.read_text()
          old="    bank_control: input.bank_control || null,\n    period_scope_complete: input.period_scope_complete ?? null\n"
          new="    bank_control: input.bank_control || null\n"
          if old not in s: raise SystemExit('deprecated fingerprint field not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/finance-cycle-engine.ts
          git commit -m 'Remove deprecated scope attestation from cycle identity'
          git push origin HEAD:feature/layer-a-close-governance-v032
