name: Apply v0.34 final fixes

on:
  push:
    branches: [feature/firebase-pilot-activation-v034]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v034-final-fixes-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/firebase-pilot-activation-v034
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final reliability fixes
        run: python scripts/apply-v034-final-fixes.py
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit patched sources
        run: |
          git config user.name "unikmo"
          git config user.email "mbanwie@googlemail.com"
          git add lib/onboarding-history.ts lib/service-deployments.ts app/api/'[...path]'/route.ts
          git commit -m "Apply v0.34 final reliability fixes [v034-final-fixes-applied]" || exit 0
          git push origin HEAD:feature/firebase-pilot-activation-v034
