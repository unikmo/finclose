name: Apply v0.34 pilot hardening

on:
  push:
    branches:
      - firebase-pilot-hardening-v034

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v034-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: firebase-pilot-hardening-v034
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply source patch
        run: python3 scripts/apply-v034-pilot-hardening.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name "unikmo"
          git config user.email "mbanwie@googlemail.com"
          git add app/api/'[...path]'/route.ts lib/managed-auth.ts lib/upload-quarantine.ts package.json package-lock.json CANONICAL_TRUTH.md docs/FIREBASE_PILOT_RELEASE_GATE.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Harden Firebase pilot auth and upload review [v034-applied]"
          git push origin HEAD:firebase-pilot-hardening-v034
