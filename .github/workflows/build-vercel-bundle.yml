name: Build temporary Vercel source bundle

on:
  push:
    branches:
      - manual-vercel-bundle

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build compressed source map
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib, subprocess
          files = {}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          for path in tracked:
              if path.startswith('.github/') or path.startswith('deployment/'):
                  continue
              p = pathlib.Path(path)
              try:
                  files[path] = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
          raw = json.dumps(files, separators=(',', ':')).encode('utf-8')
          bundle = base64.b64encode(gzip.compress(raw, compresslevel=9)).decode('ascii')
          out = pathlib.Path('deployment')
          out.mkdir(exist_ok=True)
          for old in out.glob('source*.b64'):
              old.unlink()
          chunk_size = 7000
          chunks = [bundle[i:i+chunk_size] for i in range(0, len(bundle), chunk_size)]
          for index, chunk in enumerate(chunks):
              (out / f'source-{index:03d}.b64').write_text(chunk, encoding='ascii')
          (out / 'manifest.json').write_text(json.dumps({
              'files': len(files),
              'base64_chars': len(bundle),
              'chunks': [f'source-{i:03d}.b64' for i in range(len(chunks))]
          }, indent=2), encoding='utf-8')
          print(f'Bundled {len(files)} text files; {len(bundle)} base64 characters; {len(chunks)} chunks')
          PY
      - name: Commit bundle to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A deployment
          git commit -m "Generate chunked temporary Vercel source bundle"
          git push
