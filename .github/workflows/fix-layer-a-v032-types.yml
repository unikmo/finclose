name: Fix Layer A v0.32 types
on:
  push:
    branches: [feature/layer-a-close-governance-v032]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/layer-a-close-governance-v032
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/finance-cycle-engine.ts')
          s=p.read_text()
          old='periodScopeComplete: input.period_scope_complete\n  });'
          new='periodScopeComplete: input.period_scope_complete === true\n  });'
          if old not in s: raise SystemExit('expected optional boolean handoff not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/finance-cycle-engine.ts
          git commit -m 'Fix optional close attestation typing'
          git push origin HEAD:feature/layer-a-close-governance-v032