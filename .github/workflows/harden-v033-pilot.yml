name: Harden v0.33 controlled pilot
on:
  push:
    branches: [feature/production-foundation-v033d]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[v033-pilot-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-foundation-v033d
      - name: Apply hardening
        run: python scripts/harden-v033-pilot.py
      - name: Commit hardening
        run: |
          git config user.name "unikmo"
          git config user.email "mbanwie@googlemail.com"
          git add lib/close-governance-engine.ts lib/production-ledger.ts lib/service-deployments.ts lib/onboarding-history.ts db/migrations/001_production_foundation.sql
          git commit -m "Harden v0.33 controlled pilot [v033-pilot-hardened]" || exit 0
          git push origin HEAD:feature/production-foundation-v033d
